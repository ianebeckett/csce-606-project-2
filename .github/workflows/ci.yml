name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  merge_group:

permissions:
  contents: read

# Ubuntu 26.04 has no prebuilt Ruby 4.0.1; keep Ruby jobs on 24.04.
jobs:
  tests:
    name: Quality of Work
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codecoach
          POSTGRES_PASSWORD: codecoach
          POSTGRES_DB: codecoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codecoach -d codecoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGUSER: codecoach
      PGPASSWORD: codecoach
      COVERAGE: "1"
      COVERAGE_ROOT: coverage/ci-${{ github.run_id }}-${{ github.run_attempt }}
      CUCUMBER_PUBLISH_ENABLED: "false"
      RUBOCOP_CACHE_ROOT: tmp/rubocop
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build isolated Ruby executor
        run: bin/judge-build
      - name: Prepare test database
        run: bin/rails db:prepare
      - name: Run RSpec and require at least 90% unit coverage
        run: bundle exec rspec
      - name: Run Cucumber and require at least 90% acceptance coverage
        if: ${{ !cancelled() }}
        run: bundle exec cucumber --no-profile --strict
      - name: Run retained Minitest tests
        if: ${{ !cancelled() }}
        run: bin/rails test
      - name: Require at least 90% combined coverage
        if: ${{ !cancelled() }}
        run: bundle exec ruby test_support/merge_coverage.rb
      - name: Require zero RuboCop offenses
        if: ${{ !cancelled() }}
        run: bin/rubocop --fail-level info -f github
      - name: Save coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ env.COVERAGE_ROOT }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check application JavaScript syntax
        run: node --check app/javascript/application.js

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop --fail-level info -f github

