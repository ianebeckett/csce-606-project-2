name: Quality

on:
  pull_request:
  push:
    branches: [ main ]
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: Quality of Work
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Test the quality gates
        run: bundle exec rspec --options /dev/null .github/spec

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Build isolated Ruby executor
        run: bin/judge-build

      - name: Run all tests and enforce three coverage thresholds
        run: bin/quality

      - name: Require zero RuboCop offenses
        if: ${{ !cancelled() }}
        run: bin/rubocop --fail-level info -f github . bin/quality .github/scripts .github/spec

      - name: Upload test and coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: tmp/quality/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
