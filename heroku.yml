
build:
  docker:
    web:
      dockerfile: Dockerfile
      target: heroku-web
    release:
      dockerfile: Dockerfile
      target: heroku-release
    queue:
      dockerfile: Dockerfile
      target: heroku-queue
    judge: judge/Dockerfile

release:
  image: release
  command:
    - ./bin/rails db:migrate db:seed

# Omit run so each image's CMD applies. In particular, the queue image must
# launch bin/judge-worker to start the ready pool before processing jobs.
